# usrgrp-manager keybindings
# Format: Action = KeySpec
Quit = q
# Ctrl+C quits from every screen even if this line is changed.
Quit = Ctrl+c
# Esc clears the search of the active tab. Ignore is still accepted as an action.
ClearSearch = Esc
OpenFilterMenu = f
OpenHelp = ?
StartSearch = /
Refresh = r
# Cycles the row order of the active tab: users by UID, name, shell, home;
# groups by GID, name, member count.
CycleSort = s
# Marks or unmarks the highlighted user for bulk actions (Enter with marks
# opens them; Esc clears the marks before it clears the search).
ToggleMark = Space
# Copies the highlighted name to the clipboard through the terminal (OSC 52;
# the terminal must allow it).
CopySelection = y
NewUser = n
DeleteSelection = Delete
SwitchTab = Tab
ToggleUsersFocus = BackTab
ToggleKeybindsPane = Shift+K
EnterAction = Enter
MoveUp = Up
MoveDown = Down
ToggleUsersFocus = Left
ToggleUsersFocus = Right
ToggleUsersFocus = h
ToggleUsersFocus = l
# MoveLeftPage and MoveRightPage are still accepted but no longer bound by default.
PageUp = PageUp
PageDown = PageDown
