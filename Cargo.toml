[package]
name = "usrgrp-manager"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "TUI to view and manage information about UNIX users and groups"

[[bin]]
name = "usrgrp-manager"
path = "src/main.rs"

[lib]
name = "usrgrp_manager"
path = "src/lib.rs"

[[bench]]
name = "search_and_render"
harness = false

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
dirs-next = "2.0"
# D9-approved primitives for checked effective UID and zeroizing secrets.
libc = "0.2.177"
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.23.0"

[features]
default = []

